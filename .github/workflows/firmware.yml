name: Build and release ESP Remote
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install platformio==6.1.18 pillow cryptography==46.0.3
      - name: Test OTA policy and packaging
        run: |
          python -m unittest discover -s tests -v
          g++ -std=c++17 -I remote/include tests/ota_policy_test.cpp -o /tmp/ota_test
          /tmp/ota_test
          g++ -std=c++11 -fsanitize=address,undefined -I tests/tls_stub -I remote/include tests/tls_memory_test.cpp remote/src/tls_memory.cpp -o /tmp/tls_memory_test
          /tmp/tls_memory_test
          g++ -std=c++17 -I remote/include tests/portrait_test.cpp -o /tmp/portrait_test
          /tmp/portrait_test
          g++ -std=c++17 -I tests/display_stub -I remote/include tests/display_transport_test.cpp remote/src/portrait_display.cpp -o /tmp/lcd_test
          /tmp/lcd_test
      - name: Build remote and independent LCD test
        run: |
          pio run -d remote -e es3c28p -j 4
          pio run -d remote -e display_test -j 4
      - name: Render and test real LVGL interface
        run: python tools/render_ui.py --lvgl remote/.pio/libdeps/es3c28p/lvgl --jobs 4
      - name: Package verified USB and OTA images
        id: package
        run: |
          python tools/build_release.py --boot-app "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          VERSION=$(python tools/prepare_ota_release.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd release
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ESPRemote-${{ steps.package.outputs.version }}
          path: release/
      - name: Publish stable release only after all checks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; increment FIRMWARE_VERSION for a new release."
            exit 0
          fi
          gh release create "$TAG" release/firmware.bin release/firmware-merged.bin release/ota.json release/PILOT_LCD_TEST_APP.bin release/PILOT_LCD_TEST_FULL.bin release/SHA256SUMS.txt release/ESPRemote-*-SOURCE_BIN.zip --target "$GITHUB_SHA" --title "ESP Remote $TAG" --notes-file release/notes.md --draft
          gh release edit "$TAG" --draft=false --latest
