[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = espressif32@6.9.0
board = es3c28p
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files = certs/ota_roots.bin
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
build_src_filter = +<*> -<display_test.cpp>
lib_deps =
  lvgl/lvgl@8.3.11
  adafruit/Adafruit GFX Library@1.11.11
  boschsensortec/bsec2@1.10.2610
  boschsensortec/BME68x Sensor library@1.3.40408
  sensirion/Sensirion I2C SCD4x@1.1.0
  sensirion/Sensirion Core@0.7.3
  bblanchon/ArduinoJson@6.21.5
  bodmer/TJpg_Decoder@1.1.0
  h2zero/NimBLE-Arduino@1.4.3

[env:display_test]
extends = env:es3c28p
board_build.embed_files =
build_src_filter = -<*> +<display_test.cpp> +<portrait_display.cpp>
lib_deps = adafruit/Adafruit GFX Library@1.11.11
